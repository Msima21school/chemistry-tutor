<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Спасибо за заявку — Елена Савельева</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600&family=Caveat:wght@500;600&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --navy: #1b2266;
  --soft: #5a6384;
  --gold: #f5c22b;
  --bg: #fdf9f2;
  --ink: #1d1d1d;
  --muted: #7c7c7c;
  --blue: #4a9fc2;
  --orange: #d97b14;
  --orange-hover: #c46c0d;
  --head: #46383a;
  --foot: #46383a;
  --on-dark: #f3ebe6;
  --body-font: "Montserrat", "Segoe UI", Roboto, Arial, sans-serif;
  --btn-font: "Cabin", "Montserrat", "Segoe UI", Arial, sans-serif;
  box-sizing: border-box;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: inherit; }

html {
  min-height: 100%;
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body-font);
  font-weight: 300;
  font-size: 13px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}

a {
  color: inherit;
  text-decoration: none;
}

.wrap {
  width: 100%;
  max-width: 1160px;
  margin: 0 auto;
  padding: 0 16px;
}

/* Шапка — в стиле index.html */
.top {
  background: var(--head);
  color: var(--on-dark);
}

.top .wrap {
  min-height: 50px;
  padding-top: 10px;
  padding-bottom: 5px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

.top-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}

.contact-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.rating {
  font-weight: 500;
  font-size: 13.5px;
  line-height: 1.1;
}

.rating-star {
  color: var(--orange);
}

/* Основной экран */
.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 42px 16px 56px;
}

.thanks {
  width: min(760px, 100%);
  text-align: center;
}

.molecule {
  width: 78px;
  height: 78px;
  margin: 0 auto 18px;
  color: #4d86d6;
}

.molecule svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 3.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.thanks-card {
  background: #fff;
  border-radius: 18px;
  padding: 42px 36px 38px;
  box-shadow: 0 8px 30px rgba(30, 40, 100, .09);
}

h1 {
  margin: 0;
  color: var(--navy);
  font-weight: 700;
  font-size: clamp(34px, 6vw, 58px);
  line-height: 1.05;
  letter-spacing: -.025em;
}

.lead {
  margin: 18px auto 0;
  max-width: 610px;
  color: #38405e;
  font-size: clamp(16px, 2.2vw, 20px);
  line-height: 1.45;
  font-weight: 500;
}

.highlight {
  color: var(--blue);
}

.rule {
  width: 70px;
  height: 3px;
  background: var(--gold);
  border-radius: 99px;
  margin: 22px auto 0;
}

.note {
  margin: 20px auto 0;
  color: var(--soft);
  font-size: 13px;
  font-weight: 500;
}

.btn {
  display: inline-block;
  margin-top: 25px;
  border: 0;
  border-radius: 4px;
  background: var(--orange);
  color: #fff;
  font: 600 13px/1 var(--btn-font);
  padding: 11px 22px;
  cursor: pointer;
  transition: background .15s, transform .15s;
}

.btn:hover {
  background: var(--orange-hover);
  transform: translateY(-1px);
}

/* Нижняя часть */
.foot-main {
  background: var(--foot);
  color: var(--on-dark);
  padding: 17px 0 20px;
}

.foot-main .wrap {
  display: flex;
  justify-content: center;
  text-align: center;
}

.foot-main p {
  margin: 0;
  font-weight: 500;
  font-size: 11.5px;
  line-height: 1.45;
  opacity: .82;
}

@media (max-width: 560px) {
  .top .wrap {
    min-height: 45px;
    padding-top: 8px;
    padding-bottom: 8px;
  }

  .main {
    padding: 24px 12px 34px;
  }

  .molecule {
    width: 62px;
    height: 62px;
    margin-bottom: 13px;
  }

  .thanks-card {
    border-radius: 14px;
    padding: 32px 20px 30px;
  }

  h1 {
    font-size: clamp(32px, 11vw, 46px);
  }

  .lead {
    margin-top: 15px;
    font-size: 15px;
  }

  .rule {
    margin-top: 19px;
  }

  .note {
    margin-top: 17px;
    font-size: 12px;
  }

  .btn {
    width: 100%;
    margin-top: 22px;
    padding: 12px 18px;
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="wrap">
    <div class="top-right">
      <div class="contact-row">
        <span class="rating"><span class="rating-star">★</span> 5,0 · 23 оценки</span>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <div class="thanks">

    <div class="molecule" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <path d="M30 44 46 26 72 30 80 56 60 72 36 66z"/>
        <path d="M72 30 84 12M46 26 40 8"/>
        <circle cx="30" cy="44" r="6" fill="var(--bg)"/>
        <circle cx="46" cy="26" r="6" fill="var(--bg)"/>
        <circle cx="72" cy="30" r="6" fill="var(--bg)"/>
        <circle cx="80" cy="56" r="6" fill="var(--bg)"/>
        <circle cx="60" cy="72" r="6" fill="var(--bg)"/>
        <circle cx="36" cy="66" r="6" fill="var(--bg)"/>
        <circle cx="85" cy="11" r="5" fill="var(--bg)"/>
        <path d="M86 26l8-3M90 14l6-6" stroke="var(--gold)" stroke-width="4"/>
      </svg>
    </div>

    <div class="thanks-card">
      <h1>Спасибо за заявку!</h1>

      <p class="lead">
        Я получила вашу заявку и <span class="highlight">свяжусь с вами в течение 5 минут</span>.
      </p>

      <div class="rule"></div>

      <p class="note">
        Обсудим ваши цели, уровень подготовки и подберём удобное время для занятия.
      </p>

      <a class="btn" href="index.html">Вернуться на сайт</a>
    </div>

  </div>
</main>

<footer class="foot-main">
  <div class="wrap">
    <p>Елена Савельева · репетитор по химии · ЕГЭ и ОГЭ</p>
  </div>
</footer>

</body>
</html>
